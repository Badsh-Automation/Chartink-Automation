name: Daily Chartink Dashboard

on:
  schedule:
    - cron: '30 11 * * *'  # 5:00 PM IST = 11:30 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Verify Chrome
        run: |
          google-chrome --version
          chromedriver --version

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Chartink Automation
        env:
          CHARTINK_EMAIL: ${{ secrets.CHARTINK_EMAIL }}
          CHARTINK_PASSWORD: ${{ secrets.CHARTINK_PASSWORD }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python chartink_complete.py

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-backup-${{ github.run_id }}
          path: output/Dashboard_*.xlsx
          retention-days: 7
